# The hosted testnet relayer's deposits (docs/deposits.md). switch-token.sh appends this to
# /etc/zecswap-relayer/config.toml, with the Deposits contract deploy-deposits.sh deployed.
[deposits]
contract = "<deposits>"
# The fee is $0.10 and 0.1% of the deposit; with `providers`, the $0.10 follows a first deposit's
# gas if that costs more: 1,675,751 on Sepolia's repriced state (2026-10-18), 918k of execution on
# a mainnet fork. A rescue pays the $0.10 alone.
fee = 100000
fee_gas = 1700000
fee_bps = 10
max_gas_limit = 3000000
max_gas_price_wei = 50000000000
# 2 tUSD, the owner's testnet minimum.
min_value = 2000000
max_validity = 86400
max_pending = 8
journal = "/var/lib/zecswap-relayer/deposits.sqlite"

# The mainnet beta's relayer. Its secrets come from /etc/zecswap-relayer/secrets.env
# (scripts/mainnet-secrets.sh). Replace every <...>, then install as
# /etc/zecswap-relayer/config.toml, root:zecswap-relayer, 0640.
network = "mainnet"
evm_rpc = "<the mainnet Alchemy app's URL>"
contract = "<deployments/mainnet-beta.json's contract>"
token = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
maker = "<the maker's address>"
listen = "127.0.0.1:8788"
# Every fee is the larger of its floor ($0.50) and its gas at the price now, 10% on top.
fee = 500000
# Measured on a mainnet fork on 2026-10-12: claim lock 48k, claim 237k, payout into Railgun 875k.
fee_gas = 1300000
providers = ["coinmarketcap", "alchemy"]
fee_margin_bps = 1000
claim_margin = 300
# ETH each sending account keeps, in its largest transactions: `drain-lanes` takes it back.
top_up_transactions = 4

[reverse_funding]
max_gas_limit = 4000000
max_gas_price_wei = 20000000000
fee = 500000
fee_gas = 2300000

[railgun_sends]
fee = 500000
max_gas_limit = 3000000
max_gas_price_wei = 20000000000
journal = "/var/lib/zecswap-relayer/railgun-sends.sqlite"

[gas_alerts]
low_wei = 5000000000000000
recovery_wei = 10000000000000000
interval_seconds = 300

# The mainnet token issuer. install.sh writes its key and prints the public half, which the maker's
# [tokens] and the app pin. Install as /etc/zecswap-mainnet-issuer/config.toml,
# root:zecswap-mainnet-issuer, 0640.
network = "mainnet"
listen = "127.0.0.1:8799"
# In every install's attested key: never change it once the app ships.
name = "zecswap-mainnet-issuer"
key = "/etc/zecswap-mainnet-issuer/key.pem"
data_dir = "/var/lib/zecswap-mainnet-issuer"
tokens_per_day = 3

[attestation.android-key]
roots = [
    "/etc/zecswap-mainnet-issuer/roots/google-1.pem",
    "/etc/zecswap-mainnet-issuer/roots/google-2.pem",
]
status_list = "/var/lib/zecswap-mainnet-issuer/attestation-status.json"
packages = ["xyz.justzappit.zapp"]
# SHA-256 of the signing certificate of the build testers install (`apksigner verify
# --print-certs`, or Play Console's app signing key): never a shared development key. The upload
# key signs builds handed out directly; Play re-signs its installs with the app signing key.
signing_digests = [
    "800c61a4611125fbf0ddc3d1abfe22cff7ead765e84204d6dbe562390802dfd4",
    "<Play Console's app signing key certificate SHA-256>",
]
min_security_level = "trusted-environment"

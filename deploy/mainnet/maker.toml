# The mainnet beta's maker: payouts into Railgun on Ethereum, swaps of up to $50. Its secrets come
# from /etc/zecswap-mainnet-maker/secrets.env (scripts/mainnet-secrets.sh). Replace every <...>, then
# install as /etc/zecswap-mainnet-maker/config.toml, root:zecswap-mainnet-maker, 0640.
network = "mainnet"
evm_rpc = "<the mainnet Alchemy app's URL>"
contract = "<deployments/mainnet-beta.json's contract>"
token = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
# A u1 address of a wallet you hold off this host: every forward swap's ZEC is swept to it.
sweep_to = "<u1...>"
# Zcash confirmations a deposit needs before ready, and a sweep before it counts: the owner
# chose 2 for the beta, whose swaps are small.
confirmations = 2
evm_confirmations = 12
data_dir = "/var/lib/zecswap-mainnet-maker"
listen = "127.0.0.1:8797"
# Testnet's: the inventory bounds what unpaid swaps can hold anyway. 0 refuses every new swap
# while the watchtower keeps settling the open ones: the kill switch.
max_awaiting_deposit = 20

[pricing]
spread_bps = 100
# Any amount in USDC's base units, up to $50.
unit = 1
max_units = 50000000

[pricing.market]
token_decimals = 6
refresh_seconds = 60
max_age_seconds = 300
providers = ["coinmarketcap", "alchemy"]

# Measured on a mainnet fork on 2026-10-12: open 108k and ready 44k; claim 237k, and the claim
# lock of the lock contract 48k.
[pricing.costs]
forward_gas = 220000
reverse_gas = 350000
zcash_fee_zat = 15000
margin_bps = 2000

# For the windows contract with a one-hour MIN_WINDOW and a 24-hour LATE_WINDOW: t0 an hour and a
# half after the open, so the open has half an hour to land, and t1 an hour after t0. From t0 the
# user may claim an unready swap, so one not paid in full is cancelled an hour before it, which a
# user can hold back by keeping a deposit pending; no reveal is sent with under ten minutes left
# in its window. Generous for deposits counted at 2 confirmations.
[timing]
quote_ttl = 120
t0_after = 5400
t1_after = 9000
cancel_after = 900
t0_margin = 3600
reveal_margin = 600
tick = 15

# Cancels, refunds and reverse claims through Flashbots Protect, which mines one only if it
# succeeds: the maker's other contract calls go with them, one at a time. Without it they go to
# the public mempool, priced again every three blocks until they mine. The owner's call.
# [reveals]
# private_rpc = "https://rpc.flashbots.net?hint=hash&builder=Titan&builder=Quasar&builder=Eureka&blockRange=10"

# USDC to ZEC, paid from the inventory `zecswap-maker zec-inventory` shows.
[reverse]
evm_confirmations = 12
funding_window = 900
ready_after = 7200
refund_after = 10800
deposit_margin = 1800
fee_reserve_zat = 20000

# Funded with 0.003 ETH: deploying takes 0.0005 at 0.12 gwei, a swap 0.00003 to 0.00006. A
# refund or reverse claim must hold its 240k gas at a cap 5 gwei higher, 0.0013 ETH: the alert
# comes first.
[gas_alerts]
low_wei = 1500000000000000
recovery_wei = 3000000000000000
interval_seconds = 300

# Spam tokens, from deploy/mainnet/issuer.toml's issuer: on before the app ships. The CLI gets
# none, so a CLI smoke test runs before this is on. install.sh prints the issuer key's half.
# [tokens]
# issuer = "zecswap-mainnet-issuer"
# origin = "maker"
# keys = ["<the issuer key's public half>"]
# return_key = "/etc/zecswap-mainnet-maker/return-key.pem"
# spent = "/var/lib/zecswap-mainnet-maker/spent-tokens.sqlite"

# Everything reaches nginx from cloudflared on loopback, so it can't tell callers apart, and
# limits are never per IP. Allowances go by what a request does instead, so a flood of one kind
# can't refuse another: a swap's relayer requests, which run against deadlines, have their own.
map "$request_method $uri" $zecswap_class {
    default                                                                            read;
    # Dashboards' reads, listed first: a flood of them leaves the apps' allowance alone.
    "~^(?:GET|HEAD) /(?:maker|relayer|issuer)/v1/monitor(?:/.*)?$"                     monitor;
    "~^POST /relayer/v1/(lock-claim|claim|payout|rescue)$"                             swap;
    "~^POST /relayer/v1/reverse/(fund|ready|lock-refund|refund|refund-payout|rescue)$" swap;
    "~^POST /maker/v1/(?:reverse/)?quote(?:/[^/]+/accept)?$"                           start;
    "POST /relayer/v1/railgun/transact"                                                send;
    "~^(?:GET|HEAD) /issuer/v1/challenge$"                                             tokens;
    "POST /issuer/v1/tokens"                                                           tokens;
    # The one read that asks the chain, on the RPC key the watchtower needs.
    "~^(?:GET|HEAD) /maker/v1/reverse/swaps/"                                          chain;
}

# The Worker names the swap of a relayer request whose ticket, given by the maker at accept,
# checks out. Each swap so named has an allowance of its own; the rest share a small one, so a
# flood without tickets can't hold up a claim that has one.
map "$zecswap_class $http_zecswap_swap" $zecswap_ticketed {
    default                     "";
    "~^swap (0x[0-9a-f]{64})$"  $1;
}
map "$zecswap_class $zecswap_ticketed" $zecswap_unticketed {
    default  "";
    "swap "  1;
}

# A zone counts only requests whose key isn't empty.
map $zecswap_class $zecswap_start   { start 1;   default ""; }
map $zecswap_class $zecswap_send    { send 1;    default ""; }
map $zecswap_class $zecswap_tokens  { tokens 1;  default ""; }
map $zecswap_class $zecswap_chain   { chain 1;   default ""; }
map $zecswap_class $zecswap_read    { read 1;    default ""; }
map $zecswap_class $zecswap_monitor { monitor 1; default ""; }

# Each swap's status has its own allowance as well, so an app polling its swap too fast slows
# only that swap. Ids not written as the clients write them share one.
map "$request_method $uri" $zecswap_swap {
    default                                                          "";
    "~^(?:GET|HEAD) /maker/v1/(?:reverse/)?swaps/(0x[0-9a-f]{64})$"  $1;
    "~^(?:GET|HEAD) /maker/v1/(?:reverse/)?swaps/"                   other;
}

limit_req_zone $zecswap_ticketed   zone=zecswap_ticketed:10m  rate=1r/s;
limit_req_zone $zecswap_unticketed zone=zecswap_unticketed:1m rate=2r/s;
limit_req_zone $zecswap_start   zone=zecswap_start:1m   rate=2r/s;
limit_req_zone $zecswap_send    zone=zecswap_send:1m    rate=2r/s;
limit_req_zone $zecswap_tokens  zone=zecswap_tokens:1m  rate=2r/s;
limit_req_zone $zecswap_chain   zone=zecswap_chain:1m   rate=2r/s;
limit_req_zone $zecswap_read    zone=zecswap_read:1m    rate=10r/s;
limit_req_zone $zecswap_swap    zone=zecswap_swap:10m   rate=1r/s;
limit_req_zone $zecswap_monitor zone=zecswap_monitor:1m rate=1r/s;

server {
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 16k;
    # A swap's claims and refunds past their rate wait their turn rather than being refused.
    limit_req zone=zecswap_ticketed burst=10;
    limit_req zone=zecswap_unticketed burst=20;
    limit_req zone=zecswap_start burst=20 nodelay;
    limit_req zone=zecswap_send burst=20 nodelay;
    limit_req zone=zecswap_tokens burst=20 nodelay;
    limit_req zone=zecswap_chain burst=20 nodelay;
    limit_req zone=zecswap_read burst=50 nodelay;
    limit_req zone=zecswap_swap burst=10 nodelay;
    limit_req zone=zecswap_monitor burst=10 nodelay;
    # Not 429: from the issuer, that means a device's tokens for the day are spent.
    limit_req_status 503;
    error_page 503 @busy;
    # Relayer requests for a swap without a ticket share the small allowance while apps send
    # none. Once every app sends tickets, set this to 1 to refuse them instead.
    set $zecswap_tickets_required 0;
    set $zecswap_refused "$zecswap_tickets_required$zecswap_unticketed";
    if ($zecswap_refused = 11) {
        return 403;
    }
    error_page 403 @ticketless;
    proxy_read_timeout 180s;
    proxy_connect_timeout 5s;
    proxy_next_upstream off;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    add_header Cache-Control "no-store" always;

    location /maker/ {
        proxy_pass http://127.0.0.1:8787/;
    }

    location /relayer/ {
        proxy_pass http://127.0.0.1:8788/;
    }

    location /issuer/ {
        proxy_pass http://127.0.0.1:8789/;
    }

    # Hex-encoded Railgun proofs are larger than the small authorization requests.
    location = /relayer/v1/reverse/fund {
        client_max_body_size 132k;
        proxy_pass http://127.0.0.1:8788/v1/reverse/fund;
    }

    location = /relayer/v1/railgun/transact {
        client_max_body_size 132k;
        proxy_pass http://127.0.0.1:8788/v1/railgun/transact;
    }

    # The gateway's own refusal, which clients retry. The services' 503s pass through untouched.
    location @busy {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 5 always;
        return 503 '{"code":"unavailable","error":"the swap service is busy; try again shortly"}';
    }

    location @ticketless {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 403 '{"code":"rejected","error":"a relayer request for a swap needs the ticket its accept answered with"}';
    }

    location / {
        return 404;
    }
}

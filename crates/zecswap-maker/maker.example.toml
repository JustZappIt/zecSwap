# Secrets are read from the environment, never from this file:
#   MAKER_PRIVATE_KEY   the account that opens swaps and holds inventory on the settlement chain
#   MAKER_ROOT_SECRET   32 bytes of hex; every maker share derives from it
#   MAKER_ZCASH_SEED    hex wallet seed, required only when reverse swaps are enabled
#   MAKER_MONITOR_TOKEN optional, at least 32 characters; authorizes GET /v1/monitor,
#                       /v1/monitor/swaps/{id} and /v1/monitor/economics
#   ZCASH_CMC_KEY       required when [pricing.market] lists coinmarketcap; server-side only
#   ALCHEMY_API_KEY     required when [pricing.market] lists alchemy; server-side only

network = "testnet"
lightwalletd = "https://testnet.zec.rocks:443"
evm_rpc = "https://sepolia.base.org"
contract = "0x0000000000000000000000000000000000000000"
token = "0x0000000000000000000000000000000000000000"
# The maker's own wallet; claimed deposits are swept here.
sweep_to = "utest1..."
# Confirmations a deposit needs before `ready`; unset, 10 (3 for the maker's own notes).
# Sweeps require the external-deposit depth too (10 by default).
# confirmations = 10
# EVM confirmations before retiring a forward escrow (default 12).
evm_confirmations = 12
data_dir = "maker-data"
listen = "127.0.0.1:8787"
# Accepts are refused while this many swaps, of both directions, wait on their users to pay in.
# max_awaiting_deposit = 20

[pricing]
# Token base units (6 decimals for USDC) per whole ZEC, before the spread.
price_per_zec = 40000000
spread_bps = 100
unit = 50000000
max_units = 20

# Enable live USD quotes for a six-decimal USDC token. This ignores price_per_zec.
# Prices are fetched on quote/dashboard requests, with a shared cache; no cron or polling.
# Each refresh asks the providers in order and keeps the first answer, so quotes pause only
# while every one fails. Never fall back to the fixed price once the last price is too old.
# Alchemy also keeps history: listed, it values swap costs the maker saw after the fact.
# [pricing.market]
# token_decimals = 6
# refresh_seconds = 60
# max_age_seconds = 300
# providers = ["coinmarketcap", "alchemy"]

# Charge each swap the maker's own gas and Zcash fee, on top of the spread, at the chain's gas
# price and the market prices of its quote: a ZEC to USDC swap deposits that much more ZEC, a
# USDC to ZEC swap is paid that much less. Needs [pricing.market]. Measured on Sepolia, where new
# state is repriced: an open and a ready burn 412k gas, a claim lock and a claim 362k, and a
# sweep or a reverse deposit pays 10,000 zatoshis.
# [pricing.costs]
# forward_gas = 450000
# reverse_gas = 400000
# zcash_fee_zat = 15000
# margin_bps = 2000

[timing]
quote_ttl = 120
t0_after = 2700
t1_after = 6300
cancel_after = 900
t0_margin = 300
reveal_margin = 600
tick = 15
# Quote and accept require both a recent EVM pass and a successful Zcash sync.
# Either going stale for 3 * tick seconds closes admission; EVM settlement keeps running.

# Enable only on a deployment containing openReverse and Railgun.
# Fund the address printed by `zecswap-maker --config maker.toml zec-inventory`.
# [reverse]
# evm_confirmations = 12
# funding_window = 900
# ready_after = 7200
# refund_after = 10800
# deposit_margin = 1800
# fee_reserve_zat = 20000

# A Privacy Pass token per accept, from the issuer `zecswap-issuer` runs, handed back once the
# user pays in: a device walks away from only as many swaps a day as it has tokens, and the
# maker never learns which device asked. `keys` lists the issuer's public keys (base64url SPKI,
# as `zecswap-issuer keygen` prints), the current one first. `return_key` is the maker's own
# key for handing tokens back, a second `zecswap-issuer keygen`; the app pins its public half,
# which /v1/info shows. Turn it on only once the app spends tokens.
# [tokens]
# issuer = "zecswap-issuer"
# origin = "maker"
# keys = ["..."]
# return_key = "/etc/zecswap-maker/return-key.pem"
# spent = "maker-data/spent-tokens.sqlite"

[package]
name = "zecswap-maker"
description = "ZecSwap maker: quotes, opens swaps, watches deposits and sweeps claimed ZEC"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alloy-primitives = { version = "~1.5", features = ["serde"] }
anyhow = "1"
axum = "0.8"
blake2b_simd.workspace = true
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = "0.3"
hex = "0.4"
rand.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"
zcash_address.workspace = true
zecswap-api = { path = "../zecswap-api", features = ["server"] }
zecswap-chain = { path = "../zecswap-chain" }
zecswap-tokens = { path = "../zecswap-tokens", features = ["server"] }
zecswap-core = { path = "../zecswap-core" }
zeroize.workspace = true

[dev-dependencies]
alloy = { version = "1.8", default-features = false, features = ["node-bindings"] }
base64 = "0.22"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tonic = { version = "0.14", default-features = false, features = ["channel"] }
tower = { version = "0.5", features = ["util"] }

[package]
name = "zecswap-client"
description = "The user side of a ZecSwap: every deposit decided from the chain, never from the maker's API"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alloy-primitives = { version = "~1.5", features = ["serde"] }
anyhow = "1"
rand.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time"] }
zcash_protocol.workspace = true
zecswap-api = { path = "../zecswap-api" }
zecswap-chain = { path = "../zecswap-chain" }
zecswap-core = { path = "../zecswap-core" }
zecswap-railgun = { path = "../zecswap-railgun" }
zeroize.workspace = true

[dev-dependencies]
hex = "0.4"

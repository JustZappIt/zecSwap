[package]
name = "zecswap-client"
description = "The user side of a ZecSwap: every deposit decided from the chain, never from the maker's API"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alloy-primitives = { version = "~1.5", features = ["serde"] }
anyhow = "1"
base64 = "0.22"
rand.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
zcash_protocol.workspace = true
zecswap-api = { path = "../zecswap-api" }
zecswap-chain = { path = "../zecswap-chain" }
zecswap-core = { path = "../zecswap-core" }
zecswap-railgun = { path = "../zecswap-railgun" }
zecswap-tokens = { path = "../zecswap-tokens" }
zeroize.workspace = true

[dev-dependencies]
axum = "0.8"
hex = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
zecswap-issuer = { path = "../zecswap-issuer" }
zecswap-tokens = { path = "../zecswap-tokens", features = ["server"] }

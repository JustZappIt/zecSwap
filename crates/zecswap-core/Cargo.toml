[package]
name = "zecswap-core"
description = "Split-key primitives for shielded ZEC atomic swaps settled against a Pallas-verifying contract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# pczt's transparent support links bip32 0.6 and secp256k1 0.33 already; deposit keys take
# its backend rather than a second curve stack.
bip32 = { version = "0.6", default-features = false, features = ["secp256k1-ffi"] }
blake2b_simd.workspace = true
ff.workspace = true
group.workspace = true
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
orchard.workspace = true
pasta_curves.workspace = true
pczt.workspace = true
rand.workspace = true
secp256k1 = { version = "0.33", default-features = false }
sha3 = "0.10"
zcash_address.workspace = true
zcash_note_encryption = "0.5.1"
zcash_protocol.workspace = true
zeroize.workspace = true

[dev-dependencies]
incrementalmerkletree = "0.9"
orchard = { workspace = true, features = ["circuit"] }
pczt = { workspace = true, features = ["io-finalizer", "prover", "spend-finalizer", "tx-extractor", "zcp-builder"] }
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shardtree = "0.8"
zcash_primitives = "=0.31.0-pre.0"
zcash_protocol = { workspace = true, features = ["local-consensus"] }

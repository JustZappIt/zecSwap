[package]
name = "zecswap-relayer"
description = "Sends the transactions of ZecSwap users with no account on the settlement chain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alloy-primitives = { version = "~1.5", features = ["serde"] }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zecswap-api = { path = "../zecswap-api", features = ["server"] }
zecswap-chain = { path = "../zecswap-chain" }
zecswap-core = { path = "../zecswap-core" }
zecswap-railgun = { path = "../zecswap-railgun" }
zeroize.workspace = true

[dev-dependencies]
alloy = { version = "1.8", default-features = false, features = ["node-bindings"] }
tower = { version = "0.5", features = ["util"] }

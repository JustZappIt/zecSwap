# The relayer's secrets are read from the environment, never from this file:
#   RELAYER_PRIVATE_KEY   pays the gas; keep it apart from any maker's key
#   RELAYER_MONITOR_TOKEN optional, at least 32 characters; authorizes GET /v1/monitor
#
# On Ethereum mainnet, send through a private RPC such as Flashbots Protect: a claim is safe in
# the public mempool while its lock is held, but it invites griefing.

evm_rpc = "https://ethereum-sepolia-rpc.publicnode.com"
contract = "0x0000000000000000000000000000000000000000"
# The one token (USDC) and maker whose swaps it sends for; it refuses every other swap.
token = "0x0000000000000000000000000000000000000000"
maker = "0x0000000000000000000000000000000000000000"
listen = "127.0.0.1:8788"
# Token base units kept from each payout (1 USDC).
fee = 1000000
claim_margin = 300

# Initial Railgun-to-escrow gas sponsorship, Sepolia only. Disabled when absent.
# The same RELAYER_PRIVATE_KEY pays this gas; fund that wallet with Sepolia ETH.
# Each funding transfers `fee` escrow-token base units to that account in the same transaction.
# Pin the V2 Relay Adapt address for this Railgun deployment (not the Railgun proxy).
# [reverse_funding]
# relay_adapt = "0x7e3d929ebd5bdc84d02bd3205c777578f33a214d"
# max_gas_limit = 4000000
# max_gas_price_wei = 20000000000
# fee = 250000

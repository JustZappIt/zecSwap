# The relayer's secrets are read from the environment, never from this file:
#   RELAYER_PRIVATE_KEY   the account users sign payouts for, which keeps the accounts derived
#                         from it (claims, locks, Railgun sends, fundings) in ETH; keep it
#                         apart from any maker's key
#   RELAYER_MONITOR_TOKEN optional, at least 32 characters; authorizes GET /v1/monitor and
#                         /v1/monitor/sends
#   ALCHEMY_API_KEY       optional, with [railgun_sends]: values each send's gas and fee in USD;
#                         needed when `providers` names alchemy
#   ZCASH_CMC_KEY         needed when `providers` names coinmarketcap
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  optional, both or neither, with [railgun_sends]: a
#                         message for each private send and unshield once it mines, and with
#                         [gas_alerts] when the relayer's own account runs low on ETH
#
# On Ethereum mainnet, send through a private RPC such as Flashbots Protect: a claim is safe in
# the public mempool while its lock is held, but it invites griefing.

# "testnet" or "mainnet": the relayer refuses to start on a chain, Railgun or token (USDC on
# mainnet) of another network.
network = "testnet"
evm_rpc = "https://ethereum-sepolia-rpc.publicnode.com"
contract = "0x0000000000000000000000000000000000000000"
# The one token (USDC) and maker whose swaps it sends for; it refuses every other swap.
token = "0x0000000000000000000000000000000000000000"
maker = "0x0000000000000000000000000000000000000000"
listen = "127.0.0.1:8788"
# Token base units kept from each payout at least (0.10 USDC): the floor of its fee.
fee = 100000
# With `providers`, every fee follows gas: the larger of its floor and the gas it pays for at
# the gas price and ETH price when it is quoted, with `fee_margin_bps` on top. A quoted swap fee
# is honored for an hour, a send's rate for ten minutes. A payout's fee pays for the claim lock,
# the claim and the payout (on a refund, its lock, the refund and its payout): 1.65M gas on
# Sepolia, where new state is repriced.
fee_gas = 1800000
providers = ["coinmarketcap", "alchemy"]
fee_margin_bps = 1000
claim_margin = 300
# Each derived account keeps ETH for this many of its largest transactions at the gas price now.
top_up_transactions = 8

# Initial Railgun-to-escrow gas sponsorship. Disabled when absent.
# Its derived funding account pays this gas, topped up from RELAYER_PRIVATE_KEY's: fund that one.
# Each funding transfers `fee` escrow-token base units to that account in the same transaction.
# It goes through Railgun's own V2 Relay Adapt on the network's chain; name `relay_adapt` only
# on a chain where the network has no Railgun of its own, such as a local anvil.
# [reverse_funding]
# max_gas_limit = 4000000
# max_gas_price_wei = 20000000000
# fee = 250000
# fee_gas = 2300000          # the funding (2.0M on Sepolia) and its ready

# Telegram messages when the relayer's own account (RELAYER_PRIVATE_KEY's, which tops up the
# others) has under `low_wei` of ETH, and again once a top-up brings it to `recovery_wei`. Only
# its own sends spend it, so it is read when the relayer starts and after each send, and while it
# is low every `interval_seconds` (60 to 3600) until it is topped up. Needs [railgun_sends],
# whose journal queues the messages.
# [gas_alerts]
# low_wei = 20000000000000000       # 0.02 ETH
# recovery_wei = 50000000000000000  # 0.05 ETH
# interval_seconds = 300

[package]
name = "zecswap-prices"
description = "USD prices of ZEC, USDC and ETH, now from providers in order, and at a past time from Alchemy's history"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# A local stand-in for the providers, for other crates' tests.
stand-in = ["dep:axum", "tokio/net", "tokio/rt", "tokio/time"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
zeroize.workspace = true

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[package]
name = "zecswap-cli"
description = "Test client for ZecSwap: a seed wallet plus the user side of a swap"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alloy-primitives = { version = "~1.5", features = ["serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
rand.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zcash_address.workspace = true
zcash_keys = { version = "=0.17.0-pre.0", features = ["orchard"] }
zcash_protocol.workspace = true
zip32 = "0.3"
zecswap-chain = { path = "../zecswap-chain" }
zecswap-client = { path = "../zecswap-client" }
zecswap-core = { path = "../zecswap-core" }

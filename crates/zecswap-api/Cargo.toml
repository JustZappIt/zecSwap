[package]
name = "zecswap-api"
description = "The ZecSwap maker's quote API on the wire, shared by makers and wallets"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alloy-primitives = { version = "~1.5", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
zecswap-core = { path = "../zecswap-core" }

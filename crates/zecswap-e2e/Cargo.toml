[package]
name = "zecswap-e2e"
description = "Live end-to-end runs of every swap outcome on an EVM testnet and the Zcash testnet"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
hex = "0.4"
rand.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zcash_address.workspace = true
zcash_keys = { version = "=0.17.0-pre.0", features = ["orchard"] }
zcash_protocol.workspace = true
zecswap-chain = { path = "../zecswap-chain" }
zecswap-client = { path = "../zecswap-client" }
zecswap-core = { path = "../zecswap-core" }
zecswap-issuer = { path = "../zecswap-issuer" }
zecswap-maker = { path = "../zecswap-maker" }
zecswap-railgun = { path = "../zecswap-railgun" }
zecswap-relayer = { path = "../zecswap-relayer" }
zecswap-tokens = { path = "../zecswap-tokens", features = ["server"] }
zeroize.workspace = true
zip32 = "0.3"

[[test]]
name = "live"
harness = false

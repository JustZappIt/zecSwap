[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
blake2b_simd = "1"
ff = "0.13"
group = "0.13"
orchard = { version = "0.15.4", default-features = false, features = ["std"] }
pasta_curves = "0.5"
pczt = { version = "0.9.3", default-features = false, features = ["std", "orchard", "signer"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zcash_address = "0.13"
zcash_protocol = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }

[profile.release]
lto = true
codegen-units = 1

# Halo 2 proving in the end-to-end tests is unusably slow unoptimised.
[profile.test.package."*"]
opt-level = 3
